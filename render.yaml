# Déploiement principal : Vercel (voir DEPLOIEMENT-VERCEL.md).
# Render — optionnel, API seule (sans frontend React).
services:
  - type: web
    name: figsapp-cote-divoire-api
    runtime: node
    rootDir: .
    plan: free
    autoDeploy: true
    buildCommand: npm install --omit=dev --omit=optional
    startCommand: node api/listen.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: ADMIN_COOKIE_NAME
        value: sa_admin
      - key: JSON_BODY_LIMIT
        value: 200kb
      - key: CORS_ORIGIN
        value: https://figsappcotedivoire.com,https://www.figsappcotedivoire.com
      - key: DATABASE_URL
        sync: false
